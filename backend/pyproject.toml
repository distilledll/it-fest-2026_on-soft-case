[project]
name = "onsoft-backend"
version = "0.1.0"
description = "Бэкенд ИИ-помощника по закупкам (кейс ОНСОФТ, хакатон Школы 21)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "openai>=1.40",
]

[project.optional-dependencies]
# Ставит тот, кто подключает агента; бэку они не нужны для заглушки.
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
onsoft = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
